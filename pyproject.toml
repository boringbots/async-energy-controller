[build-system]
# >=77 for PEP 639 (SPDX `license` string + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "async-energy-controller"
version = "0.3.0"
description = "Async Energy on-box controller: executes optimizer schedules, profiles GPU energy, reports run records."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Async Energy" }]
keywords = ["energy", "scheduling", "gpu", "llm", "time-of-use", "demand-response"]
classifiers = [
    "Environment:: GPU:: NVIDIA CUDA",
    "Intended Audience:: System Administrators",
    "Operating System:: POSIX:: Linux",
    "Programming Language:: Python:: 3.12",
    "Topic:: System:: Distributed Computing",
]

# The canonical pin list. Deliberately thin: the controller is a client — an HTTP
# client and a settings parser, nothing more. No web framework, no server stack.
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    # Benchmark datasets (hmasync_controller/bench/tasks/) are pulled as
    # parquet straight from the HF hub via huggingface_hub + pyarrow (US-MERGE-01,
    # ported from energy-bench's tasks/base.py). The full `datasets` package is
    # avoided on purpose: it drags in pandas/dill/multiprocess for no benefit here.
    "huggingface-hub==1.28.0",
    "pyarrow==25.0.1",
    # IFEval's language:response_language / change_case:english_* checkers
    # (bench/tasks/ifeval_checks.py) need language detection; profiles are
    # bundled in the wheel so detect() needs no network call at score time.
    "langdetect==1.0.9",
    # longctx_summary scores ROUGE-L F1 against GovReport reference summaries
    # (bench/tasks/longctx_summary.py). Works fully offline with
    # use_stemmer=False (regex tokenizer, no nltk data download).
    #
    # DISCREPANCY vs. tasks/prd-controller-merge.md's GROUND TRUTH (recorded
    # at US-MERGE-01): that doc lists only huggingface-hub/langdetect as new
    # base deps and states "numpy does NOT [join]" because only the excluded
    # humaneval sandbox needs it. That claim did not account for this
    # dependency: rouge-score==0.1.2 itself requires absl-py, nltk, numpy and
    # six. Since longctx_summary is one of the 9 tasks the GROUND TRUTH
    # explicitly names as moving, rouge-score (and its transitive numpy) has
    # to come along. This will make US-MERGE-06's dependency-audit acceptance
    # criterion ("exactly httpx, pydantic, pydantic-settings, pynvml, pyarrow,
    # huggingface-hub, langdetect") false as literally written — that story
    # needs to either widen the expected set or find a numpy-free ROUGE-L
    # scorer before asserting it.
    "rouge-score==0.1.2",
]

[project.urls]
Homepage = "https://async.energy"
Documentation = "https://async.energy/quickstart/"
Source = "https://github.com/boringbots/async-energy-controller"
Issues = "https://github.com/boringbots/async-energy-controller/issues"

[project.optional-dependencies]
# NVIDIA GPU boxes only — lazy-imported by profiler.py's NVMLProfiler. Absent →
# get_profiler() falls back to SmiProfiler (nvidia-smi CLI) or NullProfiler, so
# the controller installs and runs on a box with no GPU.
#   pip install -e ".[gpu]"
gpu = ["nvidia-ml-py==12.560.30"]
# Test-only.
test = ["pytest==9.0.3"]

# Console entrypoints: `pip install -e.` puts BOTH on PATH.
# `async-energy-controller` is the public, branded name and what the docs use.
# `hm-async-controller` is the original internal name, kept as a permanent alias
# so existing installs and systemd units keep working — do not remove it.
[project.scripts]
async-energy-controller = "hmasync_controller.cli:main"
hm-async-controller = "hmasync_controller.cli:main"

[tool.setuptools]
packages = [
    "hmasync_controller",
    "hmasync_controller.bench",
    "hmasync_controller.bench.tasks",
]

[tool.setuptools.package-data]
# The vendored bench-submission schema (hmasync_controller/bench.py) must ship
# in the built wheel/sdist, not just be readable from an editable checkout.
hmasync_controller = ["schemas/*.json"]
