[build-system]
# >=77 for PEP 639 (SPDX `license` string + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "async-energy-controller"
version = "0.3.0"
description = "Async Energy on-box controller: executes optimizer schedules, profiles GPU energy, reports run records."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Async Energy" }]
keywords = ["energy", "scheduling", "gpu", "llm", "time-of-use", "demand-response"]
classifiers = [
    "Environment:: GPU:: NVIDIA CUDA",
    "Intended Audience:: System Administrators",
    "Operating System:: POSIX:: Linux",
    "Programming Language:: Python:: 3.12",
    "Topic:: System:: Distributed Computing",
]

# The canonical pin list. Deliberately thin: the controller is a client — an HTTP
# client and a settings parser, nothing more. No web framework, no server stack.
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    # NVML sampling (hmasync_controller/nvml_reader.py, profiler.py's
    # NVMLProfiler, bench/sampler.py's LocalNvmlSampler) — promoted from the
    # `[gpu]` extra to a base dependency at US-MERGE-02, since a bare
    # `pip install async-energy-controller` now also runs `bench quick`,
    # which needs local NVML on any NVIDIA box. Stays import-lazy inside
    # both profiler.py and bench/sampler.py, so a no-GPU box still imports
    # this package cleanly and `get_profiler()` degrades to SmiProfiler/
    # NullProfiler exactly as before.
    "nvidia-ml-py==12.560.30",
    # Benchmark datasets (hmasync_controller/bench/tasks/) are pulled as
    # parquet straight from the HF hub via huggingface_hub + pyarrow (US-MERGE-01,
    # ported from energy-bench's tasks/base.py). The full `datasets` package is
    # avoided on purpose: it drags in pandas/dill/multiprocess for no benefit here.
    "huggingface-hub==1.28.0",
    "pyarrow==25.0.1",
    # IFEval's language:response_language / change_case:english_* checkers
    # (bench/tasks/ifeval_checks.py) need language detection; profiles are
    # bundled in the wheel so detect() needs no network call at score time.
    "langdetect==1.0.9",
    # NOT a dependency, on purpose: `rouge-score`. US-MERGE-01 added it for
    # longctx_summary's ROUGE-L F1 scoring, and it drags absl-py, nltk, numpy
    # and six into the base install of a package whose whole point is one thin
    # download. US-MERGE-06 replaced it with bench/tasks/rouge_l.py — ~30 lines
    # of pure Python, verified to reproduce
    # `RougeScorer(["rougeL"], use_stemmer=False)` exactly (318/318 cases,
    # tests/test_bench_rouge_l.py) — so the list above is now exactly the set
    # tasks/prd-controller-merge.md's success metrics name, and
    # tests/test_base_install_audit.py asserts it.
]

[project.urls]
Homepage = "https://async.energy"
Documentation = "https://async.energy/quickstart/"
Source = "https://github.com/boringbots/async-energy-controller"
Issues = "https://github.com/boringbots/async-energy-controller/issues"

[project.optional-dependencies]
# Back-compat no-op: `nvidia-ml-py` moved into the base `dependencies` list
# above at US-MERGE-02 (a bare install now runs `bench quick`, which needs
# NVML too). Kept as an empty extra so an existing `pip install -e ".[gpu]"`
# in a script or doc still resolves instead of erroring — same "permanent
# alias" reasoning as the `hm-async-controller` console script below.
gpu = []
# Test-only.
test = ["pytest==9.0.3"]

# Console entrypoints: `pip install -e.` puts BOTH on PATH.
# `async-energy-controller` is the public, branded name and what the docs use.
# `hm-async-controller` is the original internal name, kept as a permanent alias
# so existing installs and systemd units keep working — do not remove it.
[project.scripts]
async-energy-controller = "hmasync_controller.cli:main"
hm-async-controller = "hmasync_controller.cli:main"

[tool.setuptools]
packages = [
    "hmasync_controller",
    "hmasync_controller.bench",
    "hmasync_controller.bench.metrics",
    "hmasync_controller.bench.tasks",
]

[tool.setuptools.package-data]
# The vendored bench-submission schema (hmasync_controller/bench.py) must ship
# in the built wheel/sdist, not just be readable from an editable checkout.
hmasync_controller = ["schemas/*.json"]
